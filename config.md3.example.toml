# Rosenotify: Material 3 Expressive example. Put at the top of config.toml.
design = "md3e"            # "custom" = the old fully-configurable look (default)

[md3]
mode    = "auto"           # dark | light | auto (reads gsettings color-scheme, else dark)
source  = "wallpaper"      # seed | wallpaper | colors
seed    = "#6750A4"        # used by source = "seed" and as wallpaper fallback
variant = "analogous"      # analogous | tonal-spot | vibrant | expressive | neutral | monochrome
tint    = 2.0              # how much surfaces take the wallpaper hue (0 = grey)
motion  = "expressive"     # expressive (springy) | standard
icon_font = "IosevkaTerm Nerd Font Mono"   # font for the close / app-icon glyphs
# wallpaper = "~/Pictures/wall.png"     # explicit path; otherwise auto-detect (awww/swww/swaybg)
# wallpaper_cmd = "cat ~/.cache/wall"   # or a command that prints the path
# wallpaper_poll_ms = 5000              # 0 = sample once (polls only while a notification is showing)

# In md3e mode the generated palette replaces [theme] / [themes.*].
# Override single theme colors here (background, foreground, body, subtext, accent, low, normal,
# critical, button, button_fg, progress_track, icon_bg, icon_fg, critical_container, ...):
# [colors]
# accent = "#d0bcff"

# Shape and type of the card (these win over the MD3 defaults):
# [card]
# radius = 24
# padding = 16
# icon_size = 44
# icon_radius = 14
# font_family = "Google Sans Flex"
# font_size = 14
# summary_size = 15

# [general], [timeout], [animation], [behavior] and [[rules]] work exactly as before.
# MD3 changes these defaults when you do not set them: margin_x/margin_y = 16, spacing = 8,
# width = 400, animation style = "bounce".
